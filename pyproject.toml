[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "form-sequencer"
version = "0.1.0"
description = "Audio-driven generative music video that assembles a bureaucratic form from document fragments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-python>=4.8,<5",
    "pillow>=10.1",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "click>=8.1",
    "imageio-ffmpeg>=0.4",
    "rapidocr-onnxruntime>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
form-seq = "form_sequencer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
